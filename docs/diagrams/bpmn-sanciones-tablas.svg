<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#111827"/>
    </marker>
    <marker id="d" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1800" height="1100" fill="#fff"/>
  <text x="40" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">BPMN: sanciones disciplinarias e impacto en nomina</text>
  <text x="40" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Lineas solidas = flujo del proceso. Lineas punteadas = escritura a tablas.</text>

  <!-- ===== LANE BANDS ===== -->
  <rect x="30" y="80" width="1740" height="250" fill="#e8f2fb" stroke="#94a3b8"/>
  <rect x="30" y="80" width="50" height="250" fill="#94a3b8"/>
  <text transform="translate(58,205) rotate(-90)" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">1. Jefe o RRHH</text>

  <rect x="30" y="330" width="1740" height="420" fill="#f1f7fc" stroke="#94a3b8"/>
  <rect x="30" y="330" width="50" height="420" fill="#94a3b8"/>
  <text transform="translate(58,540) rotate(-90)" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">2. Solo RRHH</text>

  <rect x="30" y="750" width="1740" height="320" fill="#eaf4ff" stroke="#94a3b8"/>
  <rect x="30" y="750" width="50" height="320" fill="#94a3b8"/>
  <text transform="translate(58,910) rotate(-90)" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">3. Sistema / Nomina</text>

  <!-- ===== HELPER: cylinder as group pattern ===== -->
  <!-- Lane 1 flow -->
  <circle cx="140" cy="150" r="20" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="140" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">Inicio</text>

  <line x1="160" y1="150" x2="220" y2="150" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="220" y="120" width="200" height="60" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2.5"/>
  <text x="320" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. Registrar sancion</text>
  <text x="320" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">POST /sanctions</text>

  <line x1="420" y1="150" x2="500" y2="150" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="500" y="120" width="200" height="60" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="600" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Pending</text>
  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">espera decision RRHH</text>

  <!-- Lane1 DBs centered under tasks -->
  <line x1="320" y1="180" x2="320" y2="215" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <ellipse cx="320" cy="230" rx="120" ry="14" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <rect x="200" y="230" width="240" height="34" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="320" cy="264" rx="120" ry="14" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="253" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a">disciplinary_sanctions</text>
  <text x="320" y="295" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">INSERT status = Pending</text>

  <line x1="380" y1="180" x2="600" y2="215" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <ellipse cx="600" cy="230" rx="115" ry="14" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <rect x="485" y="230" width="230" height="34" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="600" cy="264" rx="115" ry="14" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="253" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a">disciplinary_faults</text>
  <text x="600" y="295" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">sin cambio (sigue Open)</text>

  <!-- ===== LANE 2 ===== -->
  <!-- connector Pending -> Procesar -->
  <path d="M 600 180 L 600 310 L 140 310 L 140 390 L 210 390" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="210" y="360" width="180" height="60" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2.5"/>
  <text x="300" y="385" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2. Procesar</text>
  <text x="300" y="405" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">POST .../process</text>

  <line x1="390" y1="390" x2="460" y2="390" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Gateway approved -->
  <path d="M 460 390 L 520 330 L 580 390 L 520 450 Z" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/>
  <text x="520" y="395" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#9a3412">is_approved?</text>

  <!-- NO / Rechazar row (top of lane2 process area) -->
  <text x="610" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">No</text>
  <path d="M 580 390 L 620 390 L 620 360 L 680 360" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="680" y="330" width="160" height="55" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2.5"/>
  <text x="760" y="363" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3a. Rechazar</text>

  <line x1="840" y1="357" x2="900" y2="357" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <ellipse cx="1030" cy="345" rx="115" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <rect x="915" y="345" width="230" height="28" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="1030" cy="373" rx="115" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <text x="1030" y="364" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700">disciplinary_sanctions</text>
  <text x="1030" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">UPDATE Cancelled + motivo</text>

  <line x1="1145" y1="359" x2="1280" y2="359" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="1310" cy="359" r="18" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="1310" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Cancelled</text>

  <!-- SI / Aprobar -->
  <text x="610" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#15803d">Si</text>
  <path d="M 580 390 L 620 390 L 620 510 L 680 510" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="680" y="480" width="160" height="55" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2.5"/>
  <text x="760" y="513" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3b. Aprobar</text>

  <!-- DBs under Aprobar - clear space -->
  <line x1="720" y1="535" x2="720" y2="575" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <ellipse cx="720" cy="595" rx="115" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <rect x="605" y="595" width="230" height="28" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="720" cy="623" rx="115" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <text x="720" y="614" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700">disciplinary_sanctions</text>
  <text x="720" y="650" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">UPDATE Applied + approved_by</text>

  <line x1="800" y1="535" x2="980" y2="575" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <ellipse cx="980" cy="595" rx="110" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <rect x="870" y="595" width="220" height="28" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="980" cy="623" rx="110" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <text x="980" y="614" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700">disciplinary_faults</text>
  <text x="980" y="650" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">UPDATE SanctionApplied</text>

  <!-- Suspension gateway FAR RIGHT - no overlap with DBs -->
  <line x1="840" y1="507" x2="1200" y2="507" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M 1200 507 L 1260 447 L 1320 507 L 1260 567 Z" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/>
  <text x="1260" y="512" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#9a3412">Suspension?</text>

  <!-- No from Suspension -->
  <text x="1360" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">No</text>
  <line x1="1320" y1="507" x2="1480" y2="507" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="1510" cy="507" r="18" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="1510" y="545" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Applied</text>

  <!-- Si down to lane 3 -->
  <text x="1220" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#15803d">Si</text>
  <path d="M 1260 567 L 1260 820 L 300 820" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- ===== LANE 3 ===== -->
  <rect x="300" y="790" width="210" height="60" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2.5"/>
  <text x="405" y="815" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">4. Calcular descuento</text>
  <text x="405" y="835" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">dias x (salario / 30)</text>

  <line x1="510" y1="820" x2="580" y2="820" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="580" y="790" width="220" height="60" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2.5"/>
  <text x="690" y="815" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">5. Impactar nomina</text>
  <text x="690" y="835" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">sin 7mo dia / sin vacaciones</text>

  <!-- 5 DB tables in a clean row -->
  <line x1="620" y1="850" x2="280" y2="900" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <ellipse cx="250" cy="920" rx="70" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <rect x="180" y="920" width="140" height="28" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="250" cy="948" rx="70" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <text x="250" y="939" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700">payrolls</text>

  <line x1="650" y1="850" x2="450" y2="900" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <ellipse cx="450" cy="920" rx="95" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <rect x="355" y="920" width="190" height="28" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="450" cy="948" rx="95" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="939" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700">ordinary_payrolls</text>

  <line x1="690" y1="850" x2="680" y2="900" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <ellipse cx="680" cy="920" rx="75" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <rect x="605" y="920" width="150" height="28" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="680" cy="948" rx="75" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <text x="680" y="939" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700">deductions</text>

  <line x1="740" y1="850" x2="920" y2="900" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <ellipse cx="960" cy="920" rx="125" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <rect x="835" y="920" width="250" height="28" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="960" cy="948" rx="125" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <text x="960" y="939" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700">deduction_payment_histories</text>

  <line x1="800" y1="820" x2="1220" y2="900" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <ellipse cx="1250" cy="920" rx="120" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <rect x="1130" y="920" width="240" height="28" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="1250" cy="948" rx="120" ry="12" fill="#dbe3ea" stroke="#334155" stroke-width="1.5"/>
  <text x="1250" y="939" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700">disciplinary_sanctions</text>
  <text x="1250" y="975" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">UPDATE payroll_id</text>

  <!-- End Applied + descuento -->
  <line x1="800" y1="820" x2="1480" y2="820" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="1515" cy="820" r="20" fill="#fff" stroke="#111" stroke-width="3"/>
  <circle cx="1515" cy="820" r="13" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="1515" y="865" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Applied + descuento</text>

  <!-- Legend box -->
  <rect x="1480" y="100" width="260" height="110" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1495" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Leyenda</text>
  <line x1="1495" y1="150" x2="1555" y2="150" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1565" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">flujo del proceso</text>
  <line x1="1495" y1="180" x2="1555" y2="180" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <text x="1565" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">escribe en tabla</text>
</svg>
