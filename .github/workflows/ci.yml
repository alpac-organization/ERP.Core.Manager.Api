name: CI - Docker Validation & Build

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  docker-validate:
    name: Docker Build & Startup Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: EnvironmentalVariables
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
        run: |
          docker buildx build \
            --secret id=gh_user,env=GH_USER \
            --secret id=gh_token,env=GH_PACKAGE_TOKEN \
            --load \
            -t erp-test .

      - name: Run app and capture logs
        run: |
          echo "🚀 Iniciando contenedor..."
          docker run -d --name test-container erp-test

          sleep 20

          echo "📄 Logs capturados:"
          docker logs test-container

          RUNNING=$(docker inspect -f '{{.State.Running}}' test-container)
          if [ "$RUNNING" != "true" ]; then
            echo "❌ El contenedor se detuvo antes de tiempo"
            exit 1
          fi
          echo "✅ El contenedor sigue corriendo"

      - name: Cleanup container
        if: always()
        run: docker rm -f test-container || true

  build:
    name: Build
    needs: docker-validate
    runs-on: ubuntu-latest
    environment: EnvironmentalVariables
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Necesario porque los paquetes ERP.Core.* son privados (mismo feed que usa Docker)
      - name: Setup private NuGet feed
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
        shell: bash
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/alpac-organization/index.json" \
            -n "github" \
            -u "$GH_USER" \
            -p "$GH_PACKAGE_TOKEN" \
            --store-password-in-clear-text

      - name: Restore
        shell: bash
        run: dotnet restore

      - name: Build
        shell: bash
        run: dotnet build -c Release --no-restore

  notify-docs:
    name: Disparar actualización de documentación
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repository_dispatch a ERP.Core.Docs.Api
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          script: |
            const branch = (context.ref || '').replace('refs/heads/', '');
            await github.rest.repos.createDispatchEvent({
              owner: 'alpac-organization',
              repo: 'ERP.Core.Docs.Api',
              event_type: 'api-updated',
              client_payload: {
                ref: branch,
                repo: context.payload.repository?.full_name ?? context.ref,
              },
            });