name: CI/CD - Migrations, Build, Tests & Package

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  PROJECT_PATH: "Back-End/ERP.Core.Manager.Api/src/ERP.Core.Manager.Api/ERP.Core.Manager.Api.csproj"
  TEST_PROJECT_PATH: "Back-End/ERP.Core.Manager.Api/test/ERP.Core.Manager.Api.Tests/ERP.Core.Manager.Api.ITests.csproj"
  PACKAGE_VERSION: "1.130.0"
  NUGET_SOURCE: "https://nuget.pkg.github.com/alpac-organization/index.json"
  NUGET_PACKAGE_NAME: "ERP.Core.Testing"

jobs:
  migrate-and-build:
    name: Migrate DB & Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: EnvironmentalVariables
    outputs:
      migration-status: ${{ steps.migration.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Setup NuGet feed para paquetes privados de GitHub
      - name: Setup private NuGet feed
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
        shell: bash
        run: |
          dotnet nuget add source "${{ env.NUGET_SOURCE }}" \
            -n "github" \
            -u "$GH_USER" \
            -p "$GH_PACKAGE_TOKEN" \
            --store-password-in-clear-text

      - name: Restore dependencies
        shell: bash
        run: dotnet restore

      # ── MIGRATIONS: Paso obligatorio antes de cualquier build/package ──
      - name: Apply EF Migrations
        id: migration
        shell: bash
        env:
          ConnectionStrings__ErpConnectionDatabase: ${{ secrets.ERP_CONNECTION_STRING }}
        run: |
          echo "🔄 Aplicando migraciones a la base de datos..."

          # Verificar que la cadena de conexión existe
          if [ -z "${{ secrets.ERP_CONNECTION_STRING }}" ]; then
            echo "::error::ERP_CONNECTION_STRING no está configurado en los secrets del repositorio"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Ejecutar las migraciones
          cd Back-End/ERP.Core.Manager.Api/src/Infrastructure
          dotnet ef database update --context ErpDbContext 2>&1

          if [ $? -ne 0 ]; then
            echo "::error::❌ Las migraciones fallaron. No se generará el paquete."
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ Migraciones aplicadas exitosamente"
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Build Release
        if: steps.migration.outputs.status == 'success'
        shell: bash
        run: |
          dotnet build -c Release --no-restore

      # ── PACK: Solo se genera si las migraciones fueron exitosas ──
      - name: Pack NuGet Package
        if: steps.migration.outputs.status == 'success'
        shell: bash
        run: |
          echo "📦 Generando paquete NuGet versión ${{ env.PACKAGE_VERSION }}..."

          # Pack del proyecto de testing con versión explícita
          cd Back-End/ERP.Core.Testing
          dotnet pack -c Release /p:Version=${{ env.PACKAGE_VERSION }} --no-restore

          if [ $? -ne 0 ]; then
            echo "::error::❌ Error al generar el paquete"
            exit 1
          fi

          echo "✅ Paquete generado exitosamente"

      # ── PUBLISH: Solo si todo lo anterior fue exitoso ──
      - name: Publish NuGet Package
        if: steps.migration.outputs.status == 'success'
        shell: bash
        env:
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
        run: |
          echo "🚀 Publicando paquete ${{ env.NUGET_PACKAGE_NAME }} v${{ env.PACKAGE_VERSION }}..."

          # Encontrar el .nupkg generado
          NUGET_PKG=$(find Back-End/ERP.Core.Testing/bin/Release -name "ERP.Core.Testing.${{ env.PACKAGE_VERSION }}.nupkg" | head -1)

          if [ -z "$NUGET_PKG" ]; then
            echo "::error::No se encontró el archivo .nupkg generado"
            ls -la Back-End/ERP.Core.Testing/bin/Release/ || true
            exit 1
          fi

          dotnet nuget push "$NUGET_PKG" \
            --source "$NGUT_SOURCE" \
            --api-key "$GH_PACKAGE_TOKEN" \
            --skip-duplicate

          echo "✅ Paquete publicado exitosamente"

      - name: Migration Failed - Notify
        if: steps.migration.outputs.status != 'success'
        shell: bash
        run: |
          echo "::warning::⚠️ Las migraciones fallaron. El pipeline NO generó un nuevo paquete."
          echo "Consulta los logs de la migración arriba para detalles del error."

  docker-validate:
    name: Docker Build & Startup Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: EnvironmentalVariables
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup private NuGet feed
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
        shell: bash
        run: |
          dotnet nuget add source "${{ env.NUGET_SOURCE }}" \
            -n "github" \
            -u "$GH_USER" \
            -p "$GH_PACKAGE_TOKEN" \
            --store-password-in-clear-text

      - name: Build Docker image
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
        run: |
          docker build \
            --build-arg GH_USER="$GH_USER" \
            --build-arg GH_PACKAGE_TOKEN="$GH_PACKAGE_TOKEN" \
            -t erp-test .

      - name: Run app and capture logs
        run: |
          echo "🚀 Iniciando contenedor..."
          timeout 25s docker run --name test-container erp-test > output.log 2>&1 || true
          echo "📄 Logs capturados:"
          cat output.log

      - name: Cleanup container
        run: docker rm -f test-container || true

  sonarqube:
    name: Build, Tests & SonarQube Analysis
    needs: [migrate-and-build, docker-validate]
    runs-on: ubuntu-latest
    environment: EnvironmentalVariables
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/scanner"
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}/scanner"

      # Setup NuGet feed
      - name: Setup private NuGet feed
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
        shell: bash
        run: |
          dotnet nuget add source "${{ env.NUGET_SOURCE }}" \
            -n "github" \
            -u "$GH_USER" \
            -p "$GH_PACKAGE_TOKEN" \
            --store-password-in-clear-text

      - name: Ensure Postgres test image
        shell: bash
        run: docker pull postgres:16-alpine

      - name: Verify Docker daemon can run containers
        shell: bash
        run: |
          docker info > /dev/null
          docker run --rm postgres:16-alpine postgres --version

      - name: Begin Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          BRANCH_ARG=""
          if [ "$EVENT_NAME" != "pull_request" ]; then
            BRANCH_ARG="/d:sonar.branch.name=$BRANCH_NAME"
          fi
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin \
            /k:"alpac-organization_ERP.Core.Manager.Api" \
            /o:"alpac-organization" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="$GITHUB_WORKSPACE/coverage/coverage.opencover.xml" \
            $BRANCH_ARG

      - name: Restore
        shell: bash
        run: dotnet restore

      - name: Build
        shell: bash
        run: dotnet build -c Release --no-restore

      - name: Run tests with coverage
        shell: bash
        run: |
          dotnet test -c Release --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutput="$GITHUB_WORKSPACE/coverage/coverage.opencover.xml" \
            /p:CoverletOutputFormat=opencover \
            /p:IncludeTestAssembly=false \
            --logger "console;verbosity=normal"

      - name: Prepare coverage report for Sonar
        shell: bash
        run: |
          COV="$GITHUB_WORKSPACE/coverage/coverage.opencover.xml"
          if [ ! -f "$COV" ]; then
            echo "::error::No se generó $COV — el profiler de coverlet no emitió reporte."
            ls -la "$GITHUB_WORKSPACE/coverage" || true
            exit 1
          fi
          echo "Reporte de cobertura: $COV"
          head -c 500 "$COV"
          echo ""

          VISITED=$(grep -m 1 -o 'visitedSequencePoints="[0-9]*"' "$COV" | tr -dc '0-9' || true)
          echo "visitedSequencePoints: ${VISITED:-desconocido}"

          if [ -z "$VISITED" ] || [ "$VISITED" -eq 0 ]; then
            echo "::error::El reporte no tiene líneas cubiertas (visitedSequencePoints=0). Los tests de integración probablemente se omitieron por Docker/Testcontainers."
            exit 1
          fi

      - name: Publish total coverage in job summary
        if: always()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          COV="$GITHUB_WORKSPACE/coverage/coverage.opencover.xml"
          if [ ! -f "$COV" ]; then
            echo "No hay reporte de cobertura para resumir." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          COVERAGE=$(grep -m 1 -o 'sequenceCoverage="[0-9.]*"' "$COV" | tr -dc '0-9.' || true)
          VISITED=$(grep -m 1 -o 'visitedSequencePoints="[0-9]*"' "$COV" | tr -dc '0-9' || true)
          TOTAL=$(grep -m 1 -o 'numSequencePoints="[0-9]*"' "$COV" | tr -dc '0-9' || true)

          {
            echo "## Cobertura total de pruebas (OpenCover)"
            echo ""
            echo "| Métrica | Valor |"
            echo "|---|---|"
            echo "| Cobertura total (líneas) | ${COVERAGE:-0}% |"
            echo "| Líneas cubiertas | ${VISITED:-0} / ${TOTAL:-0} |"
            echo "| Rama | ${BRANCH_NAME:-N/A} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: End Sonar analysis
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"

  notify-docs:
    name: Disparar actualización de documentación
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: [migrate-and-build]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repository_dispatch a ERP.Core.Docs.Api
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          script: |
            const branch = (context.ref || '').replace('refs/heads/', '');
            await github.rest.repos.createDispatchEvent({
              owner: 'alpac-organization',
              repo: 'ERP.Core.Docs.Api',
              event_type: 'api-updated',
              client_payload: {
                ref: branch,
                repo: context.payload.repository?.full_name ?? context.ref,
              },
            });
