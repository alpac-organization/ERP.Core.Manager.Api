name: CI - Docker Validation & SonarQube

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  docker-validate:
    name: Docker Build & Startup Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: EnvironmentalVariables
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
        run: |
          docker build \
            --build-arg GH_USER="$GH_USER" \
            --build-arg GH_PACKAGE_TOKEN="$GH_PACKAGE_TOKEN" \
            -t erp-test .

      # ✅ SMOKE TEST REAL (esto reemplaza todo lo de chromium)
      - name: Run app and capture logs
        run: |
          echo "🚀 Iniciando contenedor..."

          timeout 25s docker run --name test-container erp-test > output.log 2>&1 || true

          echo "📄 Logs capturados:"
          cat output.log

      - name: Cleanup container
        run: docker rm -f test-container || true

  sonarqube:
    name: Build and analyze
    needs: docker-validate
    # Linux: Testcontainers + Postgres (Linux) funcionan de forma estable, no así en windows-latest.
    runs-on: ubuntu-latest
    environment: EnvironmentalVariables
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 17
          distribution: 'zulu'

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/scanner"
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}/scanner"

      # Necesario porque los paquetes ERP.Core.* son privados (mismo feed que usa Docker)
      - name: Setup private NuGet feed
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
        shell: bash
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/alpac-organization/index.json" \
            -n "github" \
            -u "$GH_USER" \
            -p "$GH_PACKAGE_TOKEN" \
            --store-password-in-clear-text

      - name: Ensure Postgres test image
        shell: bash
        run: docker pull postgres:16-alpine

      - name: Begin Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin \
            /k:"alpac-organization_ERP.Core.Manager.Api" \
            /o:"alpac-organization" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.cobertura.reportPaths="coverage/cobertura.xml"

      - name: Restore
        shell: bash
        run: dotnet restore

      - name: Build
        shell: bash
        run: dotnet build -c Release --no-restore

      - name: Run tests with coverage
        shell: bash
        run: |
          # coverlet.collector escribe en coverage/<guid>/coverage.cobertura.xml (independiente del SO).
          dotnet test -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --logger "console;verbosity=normal" \
            /p:CoverletOutputFormat=cobertura

      - name: Prepare coverage report for Sonar
        shell: bash
        run: |
          # SonarCloud necesita una ruta fija; se copia el reporte a coverage/cobertura.xml.
          COV=$(find ./coverage -name "coverage.cobertura.xml" | head -n 1)
          if [ -z "$COV" ]; then
            echo "::error::No se encontró coverage.cobertura.xml — el profiler de coverlet no generó reporte."
            find ./coverage -type f || true
            exit 1
          fi
          cp "$COV" ./coverage/cobertura.xml
          echo "Reporte copiado a coverage/cobertura.xml"
          # Valida que sea un Cobertura XML válido. grep -m1 evita SIGPIPE bajo pipefail.
          head -c 400 ./coverage/cobertura.xml
          echo ""
          echo "line-rate global:" && grep -m 1 -o 'line-rate="[0-9.]*"' ./coverage/cobertura.xml || true

      - name: End Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"