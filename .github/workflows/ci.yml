name: Validate ERP API (Puppeteer + Chromium)

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: GH_USER  
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GH_USER=${{ secrets.GH_USER }} \
            --build-arg GH_PACKAGE_TOKEN=${{ secrets.GH_PACKAGE_TOKEN }} \
            -t erp-test .

      # CONSOLIDADO: Validar existencia y ejecución en un solo paso rápido
      - name: Verify Chromium Installation
        id: check_chrom
        run: |
          echo "🔍 Verificando binario..."
          # Intentamos encontrar 'chromium' o 'chromium-browser'
          CHROM_PATH=$(docker run --rm erp-test which chromium || docker run --rm erp-test which chromium-browser)
          
          if [ -z "$CHROM_PATH" ]; then
            echo "❌ ERROR: Chromium no está instalado en ninguna ruta conocida (/usr/bin/chromium)."
            exit 1
          fi
          
          echo "✅ Encontrado en: $CHROM_PATH"
          echo "🔍 Probando ejecución de versión..."
          
          # Si no puede ejecutar la versión (por falta de librerías), falla aquí
          docker run --rm erp-test $CHROM_PATH --version || (echo "❌ ERROR: El binario existe pero no puede ejecutarse (faltan dependencias libshared)." && exit 1)

      # SMOKE TEST: Ejecutar la app con un timeout estricto
      - name: Run app smoke test
        run: |
          echo "🚀 Iniciando aplicación para prueba de humo..."
          # Usamos --entrypoint para asegurar que no se quede colgado si el DLL tarda
          # El timeout de 15s es suficiente para ver si Kestrel levanta o crashea por Puppeteer
          timeout 15s docker run --rm erp-test || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 124 ]; then
              echo "✅ App levantó correctamente (timeout esperado)"
            else
              echo "❌ App crasheó con código $EXIT_CODE"
              exit 1
            fi
          }

      # DETECCIÓN FINAL: Buscar errores en logs sin dejarlo colgado
      - name: Detect Puppeteer launch error
        run: |
          echo "🔍 Validando logs de Puppeteer..."
          # Corremos 20 segundos y guardamos el log
          timeout 20s docker run --name test-container erp-test > output.log 2>&1 || true
          
          if grep -q "PuppeteerSharp.ProcessException" output.log || grep -q "snap install chromium" output.log; then
            echo "❌ ERROR CRÍTICO: Se detectó error de Snap o Puppeteer en los logs."
            cat output.log
            docker rm test-container
            exit 1
          fi
          echo "✅ Todo parece correcto."
          docker rm test-container