name: Validate ERP API (Puppeteer + Chromium)

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: GH_USER  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GH_USER=${{ secrets.GH_USER }} \
            --build-arg GH_PACKAGE_TOKEN=${{ secrets.GH_PACKAGE_TOKEN }} \
            -t erp-test .

      # ✅ SMOKE TEST REAL (esto reemplaza todo lo de chromium)
      - name: Run app and capture logs
        run: |
          echo "🚀 Iniciando contenedor..."
          
          timeout 25s docker run --name test-container erp-test > output.log 2>&1 || true

          echo "📄 Logs capturados:"
          cat output.log

      # ✅ VALIDACIÓN DE PUPPETEER (LA IMPORTANTE)
      - name: Validate Puppeteer execution
        run: |
          echo "🔍 Buscando errores críticos..."

          if grep -q "PuppeteerSharp.ProcessException" output.log; then
            echo "❌ ERROR: Puppeteer no pudo lanzar Chromium"
            exit 1
          fi

          if grep -q "No usable browser" output.log; then
            echo "❌ ERROR: Chromium no fue descargado correctamente"
            exit 1
          fi

          if grep -q "Failed to launch browser" output.log; then
            echo "❌ ERROR: Fallo al iniciar Chromium"
            exit 1
          fi

          if grep -q "snap install chromium" output.log; then
            echo "❌ ERROR: Intento de usar SNAP (mal entorno)"
            exit 1
          fi

          echo "✅ Puppeteer funcionando correctamente"

      - name: Cleanup container
        run: docker rm -f test-container || true