name: Docker Build & Startup Validation

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: GH_USER

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Add GitHub Packages source
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/alpac-organization/index.json" \
            --name "GitHub" \
            --username "$GH_USER" \
            --password "$GH_PACKAGE_TOKEN" \
            --store-password-in-clear-text

      - name: Restore
        run: dotnet restore ERP.Core.Manager.Api.slnx

      - name: Build
        run: dotnet build ERP.Core.Manager.Api.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test ERP.Core.Manager.Api.slnx -c Release --no-build --logger "console;verbosity=normal"

  validate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: GH_USER

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
        run: |
          docker build \
            --build-arg GH_USER="$GH_USER" \
            --build-arg GH_PACKAGE_TOKEN="$GH_PACKAGE_TOKEN" \
            -t erp-test .

      # ✅ SMOKE TEST REAL (esto reemplaza todo lo de chromium)
      - name: Run app and capture logs
        run: |
          echo "🚀 Iniciando contenedor..."

          timeout 25s docker run --name test-container erp-test > output.log 2>&1 || true

          echo "📄 Logs capturados:"
          cat output.log

      - name: Cleanup container
        run: docker rm -f test-container || true